name: RViz scaling CI (macOS)
run-name: RViz 1870 + 1890 at f88e3a45 (macOS Apple Silicon)

on:
  push:
    branches: [ci/pr1870]
    paths:
      - .github/workflows/rviz-scaling-macos.yml
      - .github/ci/macos.py
      - .github/ci/macos/pixi.toml
      - .github/ci/macos/pixi.lock

permissions:
  contents: read

env:
  RVIZ_TEST_REF: f88e3a457916b3f38030b02a55ae2ea029b29c6b
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  QT_QPA_PLATFORM: cocoa
  QT_SCALE_FACTOR: '1'
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  CCACHE_DIR: ${{ github.workspace }}/validation/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}/rviz-under-test
  CCACHE_COMPILERCHECK: content

jobs:
  build-and-test:
    if: github.repository == 'jcfurey/rviz'
    name: Rolling / macOS Apple Silicon / Cocoa
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out fork CI configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-config
          persist-credentials: false
      - name: Check out the exact follow-up commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RVIZ_TEST_REF }}
          path: rviz-under-test
          persist-credentials: false
      - name: Install RoboStack Rolling and Qt 6.11 for Apple Silicon
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          manifest-path: ci-config/.github/ci/macos/pixi.toml
          pixi-version: 'v0.82.1'
          locked: true
          cache: true
      - name: Restore native compiler cache
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: validation/ccache
          key: rviz-1870-macos-arm64-ccache-v1-${{ hashFiles('ci-config/.github/ci/macos/pixi.lock') }}
      - name: Record native display scale and build environment
        run: |
          pixi run --manifest-path ci-config/.github/ci/macos/pixi.toml \
            python ci-config/.github/ci/macos.py environment
      - name: Build rendering and common
        id: build-common
        run: |
          pixi run --manifest-path ci-config/.github/ci/macos/pixi.toml \
            python ci-config/.github/ci/macos.py build-common
      - name: Test mouse scaling without downstream plugins
        id: mouse-tests
        run: |
          pixi run --manifest-path ci-config/.github/ci/macos/pixi.toml \
            python ci-config/.github/ci/macos.py mouse
      - name: Test Cocoa expose and backing-surface regressions
        id: exposure-tests
        if: ${{ !cancelled() && steps.build-common.outcome == 'success' }}
        run: |
          pixi run --manifest-path ci-config/.github/ci/macos/pixi.toml \
            python ci-config/.github/ci/macos.py exposure
      - name: Build default plugins and test support
        run: |
          pixi run --manifest-path ci-config/.github/ci/macos/pixi.toml \
            python ci-config/.github/ci/macos.py build-plugins
      - name: Test native Cocoa viewport and marker menus plus forced-scale focus
        run: |
          pixi run --manifest-path ci-config/.github/ci/macos/pixi.toml \
            python ci-config/.github/ci/macos.py matrix
      - name: Run broader unit suites
        run: |
          pixi run --manifest-path ci-config/.github/ci/macos/pixi.toml \
            python ci-config/.github/ci/macos.py gmock
      - name: Diagnose native rendering-test crashes
        if: ${{ failure() && (steps.mouse-tests.outcome == 'failure' || steps.exposure-tests.outcome == 'failure') }}
        run: |
          pixi run --manifest-path ci-config/.github/ci/macos/pixi.toml \
            python ci-config/.github/ci/macos.py diagnostics
      - name: Save native compiler cache
        if: ${{ always() && steps.compiler-cache.outputs.cache-hit != 'true' && steps.compiler-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: validation/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload build, display, and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rviz-1870-macos-arm64-cocoa
          path: |
            validation/artifacts
            validation/build/**/test_results
            ci-config/.github/ci/macos/pixi.lock
          if-no-files-found: warn
          retention-days: 14
